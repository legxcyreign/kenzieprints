
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body class="welcome-page">

<main>

  <section class="welcome-hero" id="home">

<span id="collections" class="welcome-collections-anchor" aria-hidden="true"></span>

<div class="welcome-artwork-container">
    <img
      src="assets/welcome/kenzieprints-welcome-reference.png"

    >

<!-- CEO-APPROVED MOBILE WELCOME ARTWORK -->

>

<a
  href="kids.html"
  class="welcome-collection-link welcome-kids-link"
  aria-label="Explore the KenziePrints children's collection"
>
  <span class="welcome-portal-button">
    EXPLORE COLLECTION <span aria-hidden="true">→</span>
  </span>
</a>

<a
  href="#travel-coming-soon"
  class="welcome-collection-link welcome-travel-link"
  aria-label="Travel Collection — Coming Soon"
>
  <span class="welcome-portal-button">
    COMING SOON <span aria-hidden="true">→</span>
  </span>
</a>

</div><!-- End welcome-artwork-container -->

<div class="welcome-coming-soon" id="travel-coming-soon" hidden>

    <button
      type="button"
      class="welcome-coming-soon-close"
      aria-label="Close message"

      &times;

      Our Travel Collection is coming soon.
      Thoughtful creations for every journey,

    </p>

    <span class="welcome-coming-soon-signature">
       KenziePrints
    </span>
  </div>
</div>

    <header class="welcome-header">
      <nav class="welcome-navigation" aria-label="Main navigation">
        <a href="#home">HOME</a>
        <a href="#collections">OUR COLLECTIONS</a>       
        <a href="about.html">ABOUT</a>       
        <a href="brand-contact.html">CONTACT</a>
      </nav>
    </header>

  </section>


<section class="welcome-showcase" id="creations">

  <div class="welcome-showcase-inner">
    
<h2>A Look at Some of Our Creations</h2>

    <div class="welcome-slideshow">

      <div class="welcome-slideshow-track">

        <div class="welcome-product-slide">
          <img
            src="assets/my-little-ocean-cards-main.png"
            alt="My Little Ocean Cards"
            loading="lazy"
          >
        </div>

        <div class="welcome-product-slide">
          <img
            src="assets/alphabet-cards-main.png"
            alt="KenziePrints Alphabet Cards"
            loading="lazy"
          >
        </div>

        <div class="welcome-product-slide">
          <img
            src="assets/affirmation-cards-main.png"
            alt="KenziePrints Affirmation Cards"
            loading="lazy"
          >
        </div>

<div class="welcome-product-slide">
  <img
    src="assets/ocean-stickers-main.png"
    alt="KenziePrints Ocean Stickers"
    loading="lazy"
  >
</div>

<div class="welcome-product-slide">
  <img
    src="assets/alphabet-stickers-main.png"
    alt="KenziePrints Alphabet Stickers"
    loading="lazy"
  >
</div>

<div class="welcome-product-slide">
  <img
    src="assets/number-stickers-main.png"
    alt="KenziePrints Number Stickers"
    loading="lazy"
  >
</div>

      </div>

      <div class="welcome-slideshow-controls">

        <button
          type="button"
          class="welcome-slide-prev"

          aria-label="Pause slideshow"
        >
          &#10074;&#10074;
        </button>

        <button
          type="button"
          class="welcome-slide-next"
          aria-label="Next products"
        >
          &#10095;
        </button>

      </div>

    </div>

  </div>

</section>
